include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Compiles against archived v1 source in an isolated package configuration.
    # Its legacy package:hooptrace imports are intentional, not current code.
    - tool/release/generate_v1_upgrade_fixture.dart

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    prefer_final_locals: true
