name: Website CI

on:
  push:
    branches: [main, codex/hoopito-website]
    paths: ["website/**", ".github/workflows/website-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, types, unit tests, build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        id: dependencies
        run: |
          mkdir -p output/playwright/validate
          npm ci 2>&1 | tee output/playwright/validate/dependencies.log

      - name: Check website formatting
        id: format
        run: npm run format:check 2>&1 | tee output/playwright/validate/format.log

      - name: Check types and Astro templates
        id: types
        run: npm run check 2>&1 | tee output/playwright/validate/types.log

      - name: Test website contracts and artifact verification
        id: unit
        run: npm test 2>&1 | tee output/playwright/validate/unit.log

      - name: Build once and enforce resource budgets
        id: build
        run: npm run build 2>&1 | tee output/playwright/validate/build.log

      - name: Bind output to checked-out source and file hashes
        id: manifest
        run: node scripts/build-artifact.mjs create --source-sha "$GITHUB_SHA" 2>&1 | tee output/playwright/validate/build-identity.json

      - name: Check whitespace
        id: whitespace
        run: git diff --check 2>&1 | tee output/playwright/validate/whitespace.log

      - name: Share this run's build with browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-website-build-${{ github.sha }}
          path: |
            website/dist/
            website/build-artifact.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Record execution result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          const directory = 'output/playwright/validate';
          await mkdir(directory, { recursive: true });
          await writeFile(directory + '/execution.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, job: 'validate', browser: process.env.BROWSER, status: process.env.JOB_STATUS, steps: JSON.parse(process.env.STEPS_JSON) }, null, 2) + '\n');
          NODE

      - name: Preserve reports, logs and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-website-validate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: website/output/playwright/validate/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI (${{ matrix.browser }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
        working-directory: website
    env:
      PLAYWRIGHT_HTML_OUTPUT_DIR: output/playwright/ui-${{ matrix.browser }}/report
      PLAYWRIGHT_JSON_OUTPUT_FILE: output/playwright/ui-${{ matrix.browser }}/results.json
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        id: dependencies
        run: |
          mkdir -p output/playwright/ui-${{ matrix.browser }}
          npm ci 2>&1 | tee output/playwright/ui-${{ matrix.browser }}/dependencies.log

      - name: Download this workflow run's source-bound build
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hoopito-website-build-${{ github.sha }}
          path: website/
          digest-mismatch: error

      - name: Verify source SHA and every output file before preview
        id: verify
        run: |
          mkdir -p output/playwright/ui-${{ matrix.browser }}
          node scripts/build-artifact.mjs verify --source-sha "$GITHUB_SHA" 2>&1 | tee output/playwright/ui-${{ matrix.browser }}/build-identity.json

      - name: Install only the assigned browser
        id: browser
        run: bash scripts/install-ci-browser.sh ${{ matrix.browser }} 2>&1 | tee output/playwright/ui-${{ matrix.browser }}/browser-install.log

      - name: Run browser checks and reject flaky results
        id: tests
        run: npm run test:e2e -- --project=${{ matrix.browser }} --grep-invert @webgl --workers=2 --fail-on-flaky-tests --output=output/playwright/ui-${{ matrix.browser }}/test-results 2>&1 | tee output/playwright/ui-${{ matrix.browser }}/test.log

      - name: Record execution result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BROWSER: ${{ matrix.browser }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          const directory = 'output/playwright/ui-${{ matrix.browser }}';
          await mkdir(directory, { recursive: true });
          await writeFile(directory + '/execution.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, job: 'ui', browser: process.env.BROWSER, status: process.env.JOB_STATUS, steps: JSON.parse(process.env.STEPS_JSON) }, null, 2) + '\n');
          NODE

      - name: Preserve reports, logs and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-website-ui-${{ matrix.browser }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: website/output/playwright/ui-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14

  webgl:
    name: WebGL (Chromium software renderer, shard ${{ matrix.shard }}/2)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: website
    env:
      PLAYWRIGHT_HTML_OUTPUT_DIR: output/playwright/webgl-chromium-${{ matrix.shard }}/report
      PLAYWRIGHT_JSON_OUTPUT_FILE: output/playwright/webgl-chromium-${{ matrix.shard }}/results.json
      DEBUG: pw:browser
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        id: dependencies
        run: |
          mkdir -p output/playwright/webgl-chromium-${{ matrix.shard }}
          npm ci 2>&1 | tee output/playwright/webgl-chromium-${{ matrix.shard }}/dependencies.log

      - name: Download this workflow run's source-bound build
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hoopito-website-build-${{ github.sha }}
          path: website/
          digest-mismatch: error

      - name: Verify source SHA and every output file before preview
        id: verify
        run: |
          mkdir -p output/playwright/webgl-chromium-${{ matrix.shard }}
          node scripts/build-artifact.mjs verify --source-sha "$GITHUB_SHA" 2>&1 | tee output/playwright/webgl-chromium-${{ matrix.shard }}/build-identity.json

      - name: Install only the assigned browser
        id: browser
        run: bash scripts/install-ci-browser.sh chromium 2>&1 | tee output/playwright/webgl-chromium-${{ matrix.shard }}/browser-install.log

      - name: Run browser checks and reject flaky results
        id: tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/ci-runtime-sampler.mjs --output output/playwright/webgl-chromium-${{ matrix.shard }}/runtime.jsonl -- npm run test:e2e -- --config=playwright.webgl.config.ts --project=chromium --grep @webgl --shard=${{ matrix.shard }}/2 --workers=1 --fail-on-flaky-tests --output=output/playwright/webgl-chromium-${{ matrix.shard }}/test-results 2>&1 | tee output/playwright/webgl-chromium-${{ matrix.shard }}/test.log

      - name: Record execution result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          BROWSER: chromium
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          const directory = 'output/playwright/webgl-chromium-${{ matrix.shard }}';
          await mkdir(directory, { recursive: true });
          await writeFile(directory + '/execution.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, job: 'webgl', browser: process.env.BROWSER, shard: { current: Number(process.env.SHARD_INDEX), total: 2 }, status: process.env.JOB_STATUS, steps: JSON.parse(process.env.STEPS_JSON) }, null, 2) + '\n');
          NODE

      - name: Preserve reports, logs and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-website-webgl-chromium-shard-${{ matrix.shard }}-of-2-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: website/output/playwright/webgl-chromium-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
