name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  FLUTTER_FRAMEWORK_REVISION: 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
  JAVA_VERSION: 17.0.20+8
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: 36.1.0
  ANDROID_NDK: 28.2.13676358

jobs:
  quality:
    name: Format, analyze, tests, schema, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pin and verify Android and Flutter toolchains
        run: bash tool/release/prepare_android_toolchain.sh

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify vendored SQLite source build input
        run: dart --packages=.dart_tool/package_config.json tool/release/verify_sqlite_source.dart

      - name: Verify Android release-runtime notices
        run: |
          ./android/gradlew -p android :app:exportReleaseRuntimeCoordinates
          diff -u third_party/android_runtime/coordinates.txt build/app/reports/release-runtime-coordinates.txt

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Test startup measurement and backup observation gates
        run: >-
          python3 -m unittest -v
          tool.release.tests.test_measure_entry_startup
          tool.release.tests.test_compare_entry_startup_runs
          tool.release.tests.test_observe_automatic_backup
          tool.release.tests.test_ci_android_integration

      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-golden-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run deterministic performance benchmarks
        run: flutter test --reporter expanded test/performance/task15_query_benchmarks_test.dart

      - name: Validate bilingual release metadata
        run: dart --packages=.dart_tool/package_config.json tool/release/validate_metadata.dart

      - name: Verify third-party notices are reproducible
        run: |
          dart --packages=.dart_tool/package_config.json tool/release/generate_third_party_notices.dart
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Verify Drift schema and migration contract
        run: >-
          flutter test --reporter expanded
          test/core/data/schema_v2_test.dart
          test/core/data/schema_v2_fix_round1_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Test native backup and Android window policies
        run: ./android/gradlew -p android :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  reproducible-android:
    name: Reproduce unsigned Android release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pin and verify Android and Flutter toolchains
        run: bash tool/release/prepare_android_toolchain.sh

      - name: Build twice from independent source trees and compare
        run: bash tool/release/verify_unsigned_reproducible_android.sh

      - name: Upload reproducibility failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-reproducibility-failures
          path: build/reproducible-diagnostics
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload verified unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hoopito-unsigned-reproducible-apk
          path: |
            build/reproducible/app-release.apk
            build/reproducible/SHA256SUMS
            build/reproducible/FLUTTER_TOOLCHAIN.json
            build/reproducible/JAVA_TOOLCHAIN.txt
            build/reproducible/ANDROID_TOOLCHAIN.txt
            build/reproducible/RUNNER_IDENTITY.txt
            build/reproducible/REPRODUCIBILITY.txt
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Android API ${{ matrix.api-level }} integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pin and verify Android and Flutter toolchains
        run: bash tool/release/prepare_android_toolchain.sh

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: bash tool/release/run_android_integration_ci.sh ${{ matrix.api-level }}

  ios-no-sign:
    name: iOS no-sign compile
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile iOS release without signing
        run: flutter build ios --release --no-codesign --no-pub
