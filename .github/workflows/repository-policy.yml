name: Repository policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test routing, merge gates and workflow policy
        run: python3 -m unittest discover -s tool/ci/tests -v
      - name: Check branch purpose and pull request title
        run: python3 tool/ci/check_pr_conventions.py
      - name: Check approved actions, full SHA pins and matrix coverage
        run: python3 tool/ci/check_workflows.py
      - name: Check submitted whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 tool/ci/check_whitespace.py
