name: Bug report / 缺陷报告
description: Report a reproducible Hoopito · 球豆 problem / 报告可复现问题
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities here; use private vulnerability reporting.
        安全漏洞请使用私密漏洞报告，不要在此公开。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: 2.0.1+5
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version / 设备与 Android 版本
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source / 安装来源
      options:
        - GitHub Release
        - F-Droid
        - Local source build / 本地源码构建
        - Third-party package / 第三方安装包
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Use test data only and remove player names from screenshots or backups.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断信息
      description: Logs, screenshots, recording mode, rule, locale, theme, and text scale. Do not attach personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查
      options:
        - label: I searched existing issues / 我已搜索现有 Issue
          required: true
        - label: I removed real player data and signing secrets / 我已移除真实球员数据和签名信息
          required: true
