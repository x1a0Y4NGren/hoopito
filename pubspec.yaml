name: hoopito
description: Offline-first basketball one-on-one scoring and replay.
publish_to: "none"
version: 2.0.1+5

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  csv: ^8.0.0
  drift: 2.34.0
  file_picker: ^12.0.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  lottie: ^3.3.3
  path: ^1.9.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqlite3: ^3.5.2
  url_launcher: ^6.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/
    - assets/animations/
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400

# Build SQLite from the pinned amalgamation checked into the repository. This
# keeps F-Droid/offline builds independent of package:sqlite3's GitHub binary
# release downloads. See docs/release/reproducible-builds.md.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
